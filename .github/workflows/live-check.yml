name: live-check

# Read-only checks of the deployed site (canonical host, robots, sitemap, AI text files, social images, redirects, IndexNow key, headers).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-live.mjs
